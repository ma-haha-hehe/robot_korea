# "magnet": 红2x2底 + 蓝2x2顶 (2块居中堆叠)。装配点=装配区原点(base pos [0,0,0])。
# 坐标 pos=[x, y, z] 是相对装配原点的偏移(米)。z 每层 +0.0192(一块砖高)。
# 全部正交, 无 45°斜放; 2x2 方块朝向无长轴之分。
blocks:
  - name: "red_2x2_base"
    type: "brick_2x2"
    color: "red"
    vision_label: "brick."
    pos: [0.0000, 0.0000, 0.0000]
    rotation: [0, 0, 0]

  - name: "blue_2x2_top"
    type: "brick_2x2"
    color: "blue"
    vision_label: "blue 2x2 brick."
    pos: [0.0000, 0.0000, 0.0192]
    rotation: [0, 0, 0]
