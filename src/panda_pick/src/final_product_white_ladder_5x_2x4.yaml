# Five-white-brick real-robot validation product.
#
# The bottom layer uses three parallel white 2x4 bricks. The second layer uses
# two white 2x4 bricks rotated by 90 degrees to bridge across the base. This
# keeps all targets visually identical, so it is useful for testing repeated
# same-class perception with frozen-observation used-region exclusion.

blocks:
  - name: "white_2x4_base_left"
    type: "brick_4x2"
    color: "white"
    vision_label: "white 2x4 brick."
    pos: [-0.0640, 0.0000, 0.0000]
    rotation: [0, 0, 0]

  - name: "white_2x4_base_center"
    type: "brick_4x2"
    color: "white"
    vision_label: "white 2x4 brick."
    pos: [0.0000, 0.0000, 0.0000]
    rotation: [0, 0, 0]

  - name: "white_2x4_base_right"
    type: "brick_4x2"
    color: "white"
    vision_label: "white 2x4 brick."
    pos: [0.0640, 0.0000, 0.0000]
    rotation: [0, 0, 0]

  - name: "white_2x4_top_left_cross"
    type: "brick_4x2"
    color: "white"
    vision_label: "white 2x4 brick."
    pos: [-0.0320, 0.0000, 0.0192]
    rotation: [0, 0, 90]

  - name: "white_2x4_top_right_cross"
    type: "brick_4x2"
    color: "white"
    vision_label: "white 2x4 brick."
    pos: [0.0320, 0.0000, 0.0192]
    rotation: [0, 0, 90]
