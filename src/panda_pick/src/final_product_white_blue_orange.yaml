# Three-block product for real-robot validation.
#
# Blocks (bottom -> top):
#   - one white 2x4 brick   : base layer
#   - one blue  2x4 brick   : stacked on the white base (same orientation)
#   - one orange 2x2 brick  : centered on top
#
# Coordinates are placement offsets relative to
# placement.assembly_origin_base_xyz in vision_execution_bridge.yaml.
# z increases by one brick height (~0.0192 m) per layer.

blocks:
  - name: "white_2x4_base"
    type: "brick_4x2"
    color: "white"
    vision_label: "white 2x4 brick."
    pos: [0.0000, 0.0000, 0.0000]
    rotation: [0, 0, 0]

  - name: "blue_2x4_middle"
    type: "brick_4x2"
    color: "blue"
    vision_label: "blue 2x4 brick."
    pos: [0.0000, 0.0000, 0.0192]
    rotation: [0, 0, 0]

  - name: "orange_2x2_top"
    type: "brick_2x2"
    color: "orange"
    vision_label: "orange 2x2 brick."
    pos: [0.0000, 0.0000, 0.0384]
    rotation: [0, 0, 0]
