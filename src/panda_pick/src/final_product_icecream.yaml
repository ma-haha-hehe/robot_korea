# "icecream": 5 块 4 层。装配点 = 装配区原点(assembly_origin_base_xyz)。
# 坐标 pos=[x, y, z] 是相对装配原点的偏移(米)。z 每层 +0.0192(一块砖高)。
# 朝向沿用 burger: 2x4 长轴沿 base Y 轴(rotation 90); 红/蓝并排沿 y 各偏 ±0.016(Duplo 1 stud=16mm), 正好各盖住下面 2x4 的一半, 合起来与 2x4 完全重叠。
# 层次(底 -> 顶):
#   L0 黄 2x2                : 底座, 居中
#   L1 黄 2x4                : 中间层, 居中(长轴沿 y, rotation 90)
#   L2 红 2x2 + 蓝 2x2 并列  : 沿 y 各偏 ±0.016, 两块拼满(无缝无叠)与下面 2x4 完全重叠
#   L3 绿 2x2                : 顶层, 居中(压在红/蓝中缝上)
blocks:
  - name: "yellow_2x2_base"
    type: "brick_2x2"
    color: "yellow"
    vision_label: "yellow 2x2 brick."
    pos: [0.0000, 0.0000, 0.0000]
    rotation: [0, 0, 0]

  - name: "yellow_2x4_middle"
    type: "brick_4x2"
    color: "yellow"
    vision_label: "yellow 2x4 brick."
    pos: [0.0000, 0.0000, 0.0192]
    rotation: [0, 0, 90]

  - name: "red_2x2_upper_left"
    type: "brick_2x2"
    color: "red"
    vision_label: "brick."
    pos: [0.0000, -0.0160, 0.0384]
    rotation: [0, 0, 90]   # 放置角与下方 2x4 一致(夹爪两指沿 X), 避开沿 Y 相邻的另一块 2x2

  - name: "blue_2x2_upper_right"
    type: "brick_2x2"
    color: "blue"
    vision_label: "blue 2x2 brick."
    pos: [0.0000, 0.0160, 0.0384]
    rotation: [0, 0, 90]   # 放置角与下方 2x4 一致(夹爪两指沿 X), 避开沿 Y 相邻的另一块 2x2

  - name: "green_2x2_top"
    type: "brick_2x2"
    color: "green"
    vision_label: "green 2x2 brick."
    pos: [0.0000, 0.0000, 0.0576]
    rotation: [0, 0, 0]
