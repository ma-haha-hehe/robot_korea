# "battery" product: two 2x2 bricks stacked.
#
# Blocks (bottom -> top):
#   - one blue   2x2 brick : base
#   - one yellow 2x2 brick : stacked on top (same orientation)
#
# Coordinates are placement offsets relative to
# placement.assembly_origin_base_xyz in vision_execution_bridge.yaml.
# z increases by one brick height (~0.0192 m) per layer.

blocks:
  - name: "blue_2x2_base"
    type: "brick_2x2"
    color: "blue"
    vision_label: "blue 2x2 brick."
    pos: [0.0000, 0.0000, 0.0000]
    rotation: [0, 0, 0]

  - name: "yellow_2x2_top"
    type: "brick_2x2"
    color: "yellow"
    vision_label: "yellow 2x2 brick."
    pos: [0.0000, 0.0000, 0.0192]
    rotation: [0, 0, 0]
