# Tier-3 real-robot validation product.
#
# Three white 2x4 bricks form a bridge. A red 2x4 brick and a yellow 2x2
# brick are added on top. This is the highest real-robot validation tier used
# in the current thesis experiment: repeated identical parts, mixed colors,
# mixed part sizes, five planned actions, and a taller final structure.

