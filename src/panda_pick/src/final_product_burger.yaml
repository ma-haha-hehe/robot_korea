# "burger": 5 块 4 层。装配点 = 装配区原点(assembly_origin_base_xyz)。
# 坐标 pos=[x, y, z] 是相对装配原点的偏移(米)。z 每层 +0.0192(一块砖高)。
# 2026-07-03: 整体绕 Z 旋转 90°(换到另一个朝向): 2x4 长轴沿 y, 红/蓝并列沿 y。
# 层次(底 -> 顶):
#   L0 黄 2x2                : 底座, 居中
#   L1 黄 2x4                : 中间层, 居中(长轴沿 y, rotation 90)
#   L2 红 2x2 + 蓝 2x2 并列  : 沿 y 各偏 ±0.008, 正好盖住下面 2x4 的两半
#   L3 绿 2x2                : 顶层, 居中(压在红/蓝中缝上)
blocks:
  - name: "yellow_2x4_base"
    type: "brick_4x2"
    color: "yellow"
    vision_label: "yellow 2x4 brick."
    pos: [0.0000, 0.0000, 0.0000]
    rotation: [0, 0, 0]


  - name: "red_2x2_upper_left"
    type: "brick_2x2"
    color: "red"
    vision_label: "red 2x2 brick."
    pos: [0.0000, -0.0080, 0.0384]
    rotation: [0, 0, 0]

  - name: "blue_2x2_upper_right"
    type: "brick_2x2"
    color: "blue"
    vision_label: "blue 2x2 brick."
    pos: [0.0000, 0.0080, 0.0384]
    rotation: [0, 0, 0]

  - name: "green_2x2_top"
    type: "brick_2x2"
    color: "green"
    vision_label: "green 2x2 brick."
    pos: [0.0000, 0.0000, 0.0576]
    rotation: [0, 0, 0]
