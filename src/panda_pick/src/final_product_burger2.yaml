# "burger2": 4 块 3 层。装配点 = 装配区原点(assembly_origin_base_xyz)。
# 坐标 pos=[x, y, z] 是相对装配原点的偏移(米)。z 每层 +0.0192(一块砖高)。1 stud = 0.016m(Duplo)。
# 2026-07-04: 整体绕 Z 转 90° -> 所有 2x4 长轴沿 base X 轴(rotation 0), 红层内联沿 X。
# 层次(底 -> 顶):
#   L0 黄 2x4            : 底座, 居中 (沿 x 覆盖 4 studs: s1..s4, 中心 0)
#   L1 红 2x4 + 红 2x2   : 沿长轴(x)内联, 两端各悬 1 stud, L1 整体 6 studs 与黄底同中心
#        - 红 2x4: 压黄 3 个 stud + 悬出 1; 中心 = -1 stud = x -0.016
#        - 红 2x2: 补黄 1 个 stud + 悬出 1; 中心 = +2 studs = x +0.032
#   L2 黄 2x4            : 顶层, 居中(与 L0 黄 2x4 中心点相同)
blocks:
  - name: "yellow_2x4_base"
    type: "brick_4x2"
    color: "yellow"
    vision_label: "yellow 2x4 brick."
    pos: [0.0000, 0.0000, 0.0000]
    rotation: [0, 0, 0]

  - name: "red_2x4_middle"
    type: "brick_4x2"
    color: "red"
    vision_label: "red 2x4 brick."
    pos: [-0.0160, 0.0000, 0.0192]
    rotation: [0, 0, 0]

  - name: "red_2x2_middle_fill"
    type: "brick_2x2"
    color: "red"
    vision_label: "red 2x2 brick."
    pos: [0.0320, 0.0000, 0.0192]
    rotation: [0, 0, 90]

  - name: "yellow_2x4_top"
    type: "brick_4x2"
    color: "yellow"
    vision_label: "yellow 2x4 brick."
    pos: [0.0000, 0.0000, 0.0384]
    rotation: [0, 0, 0]
