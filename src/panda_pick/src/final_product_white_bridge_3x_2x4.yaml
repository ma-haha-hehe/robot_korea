# Three-white-2x4 final product for duplicate-object real-robot tests.
#
# Shape: two white 2x4 bricks form the base, and the third white 2x4 crosses
# over them on the second layer. This is intentionally not a simple vertical
# stack, so the planner must use both placement offsets and yaw.
#
# Coordinates are placement offsets relative to
# placement.assembly_origin_base_xyz in vision_execution_bridge.yaml.

blocks:
  - name: "white_2x4_base_left"
    type: "brick_4x2"
    color: "white"
    vision_label: "white 2x4 brick."
    pos: [-0.0320, 0.0000, 0.0000]
    rotation: [0, 0, 0]

  - name: "white_2x4_base_right"
    type: "brick_4x2"
    color: "white"
    vision_label: "white 2x4 brick."
    pos: [0.0320, 0.0000, 0.0000]
    rotation: [0, 0, 0]

  - name: "white_2x4_top_cross"
    type: "brick_4x2"
    color: "white"
    vision_label: "white 2x4 brick."
    pos: [0.0000, 0.0000, 0.0192]
    rotation: [0, 0, 90]
