# Simple mixed-color five-block product for real-robot validation.
#
# Blocks:
#   - two white 2x4 bricks form a stable bottom layer
#   - one green 2x4 and one blue 2x4 form a crossing second layer
#   - one orange 2x2 is centered on the top layer
#
# Coordinates are placement offsets relative to
# placement.assembly_origin_base_xyz in vision_execution_bridge.yaml.

blocks:
  - name: "white_2x4_base_left"
    type: "brick_4x2"
    color: "white"
    vision_label: "white 2x4 brick."
    pos: [-0.0320, 0.0000, 0.0000]
    rotation: [0, 0, 0]

  - name: "white_2x4_base_right"
    type: "brick_4x2"
    color: "white"
    vision_label: "white 2x4 brick."
    pos: [0.0320, 0.0000, 0.0000]
    rotation: [0, 0, 0]

  - name: "green_2x4_middle_cross"
    type: "brick_4x2"
    color: "green"
    vision_label: "green 2x4 brick."
    pos: [0.0000, 0.0000, 0.0192]
    rotation: [0, 0, 90]

  - name: "blue_2x4_upper"
    type: "brick_4x2"
    color: "blue"
    vision_label: "blue 2x4 brick."
    pos: [0.0000, 0.0000, 0.0384]
    rotation: [0, 0, 0]

  - name: "orange_2x2_top"
    type: "brick_2x2"
    color: "orange"
    vision_label: "orange 2x2 brick."
    pos: [0.0000, 0.0000, 0.0576]
    rotation: [0, 0, 0]
