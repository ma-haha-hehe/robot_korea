# Hand-eye calibration samples for the gripper-mounted camera on UR5 tool0.
#
# Important:
# - image and T_base_tool must come from the same robot pose.
# - Do not use any sample where print_pose returned all zeros.
# - You said this is a 2x2 ChArUco-style calibration board. A true ChArUco
#   board with only 2x2 squares has only one interpolated chess corner, so
#   pose estimation may need to use it as an ArUco grid board.
pattern: charuco
dictionary: DICT_4X4_50
board_size: [2, 2]
square_size: 0.025
marker_size: 0.018
marker_ids: [4, 5]

# Leave these null unless you want to force RealSense intrinsics manually.
camera_matrix: null
dist_coeffs: null

