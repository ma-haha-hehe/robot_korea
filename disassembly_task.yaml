# 拆卸任务偏移 —— 独立于装配(pick_place_task.yaml), 不要混用。
# 单位: dx/dy/dz/descend 米, yaw_deg 度。都是相对【示教好的抓取/放置关节角】的小偏移。
# joint_pick_place 流程会用这些值做: 下降 descend 抓取 -> 提起 -> 到放置位 -> 下降 place.descend -> 松开。
#
# 每次 disassembly_arm_pull.sh 只跑一块, 所以这里只有一个 task。
# pick.descend  = 从抓取接近位再往下多少够到这块积木(先小一点试, 5mm 步进调)。
# place.descend = 到放置区往下放多少。
tasks:
- id: disassemble_one
  pick:
    dx: 0.0
    dy: 0.0
    dz: 0.0
    yaw_deg: 0.0
    descend: 0.065          # from DIS_PULL_* pre-pull pose down to the brick
    slow_final_descend: 0.0
  place:
    dx: 0.0
    dy: 0.0
    dz: 0.0
    yaw_deg: 0.0
    descend: 0.04          # from DIS_DROP_JOINTS down to the release height
    slow_final_descend: 0.0
