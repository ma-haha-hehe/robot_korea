# 拆卸任务偏移 —— 独立于装配(pick_place_task.yaml), 不要混用。
# 单位: dx/dy/dz/descend 米, yaw_deg 度。都是相对【示教好的抓取/放置关节角】的小偏移。
# joint_pick_place 流程会用这些值做: 下降 descend 抓取 -> 提起 -> 到放置位 -> 下降 place.descend -> 松开。
#
# 每次 disassembly_arm_pull.sh 只跑一块, 所以这里只有一个 task。
# pick.descend  = 从抓取接近位再往下多少够到这块积木(先小一点试, 5mm 步进调)。
# place.descend = 到放置区往下放多少。
tasks:
- id: disassemble_one
  pick:
    dx: 0.0
    dy: 0.0
    dz: 0.0               # 2026-07-02 不抬升: movej落点(示教关节位)即接近点(高处), 无多余抬升阶段
    yaw_deg: 0.0
    descend: 0.116         # ...0.114->0.119->0.116 (2026-07-04 carrot拆卸抓取升高3mm)
    slow_final_descend: 0.0
  place:
    dx: 0.0
    dy: 0.0
    dz: 0.0              # 往前15cm增量由 DROP_STEP(base +X) 传; 往下用 descend 表达
    yaw_deg: 0.0
    descend: 0.15        # 2026-07-02 放置点 = observe往下15cm(再低2cm; observe->横移+X->下降->松)
    slow_final_descend: 0.0
