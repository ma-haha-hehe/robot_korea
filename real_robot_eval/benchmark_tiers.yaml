# Real-robot validation benchmark used for the thesis evaluation addendum.
#
# The real-robot experiment currently uses only Tier 1 to Tier 3. The larger
# five-block bridge-plus-red/yellow product is treated as Tier 3 for hardware
# validation because it already combines repeated identical parts, mixed colors,
# mixed part sizes, longer horizon execution, and taller placement.

tiers:
  - tier: 1
    name: single_2x4
    product_yaml: src/panda_pick/src/final_product_tier1_single_2x4.yaml
    planned_steps: 1
    recommended_trials: 5
    purpose: single-object perception-to-execution validation
    main_metrics:
      - vision_success
      - grasp_success
      - placement_success
      - total_time_s

  - tier: 2
    name: stack_3x_2x4
    product_yaml: src/panda_pick/src/final_product_tier2_stack_3x_2x4.yaml
    planned_steps: 3
    recommended_trials: 3
    purpose: multi-step stacking and vertical error accumulation
    main_metrics:
      - successful_steps
      - assembly_success
      - insertion_quality
      - total_time_s

  - tier: 3
    name: bridge_plus_red_yellow
    product_yaml: src/panda_pick/src/final_product_tier3_bridge_plus_red_yellow.yaml
    planned_steps: 5
    recommended_trials: 3
    purpose: repeated identical parts, mixed colors, mixed part sizes, and taller assembly
    main_metrics:
      - repeated_object_selection_success
      - used_region_exclusion_success
      - color_selection_success
      - successful_steps
      - assembly_success
      - async_overlap_saved_s
