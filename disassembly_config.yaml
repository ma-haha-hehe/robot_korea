# 拆卸配置 —— 独立于装配, 不要和装配 yaml(final_product_*.yaml / tasks*.yaml) 混用。
#
# 从上往下拆: steps 的顺序就是拆的顺序(先拆最顶上的)。
# 每一步:
#   name:        步骤名(随便起, 只用于打印)
#   clamp_level: 夹持器夹住"目标块下面那块"所在的档位
#                0..3 对应 clamp_control.py 的高度 0.0 / 0.04 / 0.08 / 0.115
#   arm_pose:    机械臂拔这一块用的(示教)动作名, 会传给 disassembly_arm_pull.sh
#
# 注意档位随塔变矮而下降(从上往下拆): clamp_level 一步比一步小。
# 最底下那块一般留着不拆; 要拆再加一步。

settle_after_clamp: 1.0    # 夹紧后、机械臂动作前等待秒数(确保已夹稳)

steps:
  - name: block_top
    clamp_level: 2
    arm_pose: pull_top
  - name: block_3
    clamp_level: 1
    arm_pose: pull_3
  - name: block_2
    clamp_level: 0
    arm_pose: pull_2
